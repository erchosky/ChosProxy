name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (format, lint, typecheck, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chosproxy/desktop format:check
      - run: pnpm --filter @chosproxy/desktop lint
      - run: pnpm --filter @chosproxy/desktop typecheck
      - run: pnpm --filter @chosproxy/desktop test

  rust:
    name: Rust (format, clippy, unit + integration tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Tauri crate embeds the built frontend at compile time.
      - run: pnpm --filter @chosproxy/desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Generated TypeScript bindings are committed
        run: node scripts/check-bindings.mjs

  audit:
    name: Dependency advisories (RustSec, npm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained"/"unsound" warnings are
      # reported and reviewed in docs/audits/.
      - run: cargo audit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod

  build:
    name: Build Linux packages (.deb, AppImage)
    needs: [frontend, rust, audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chosproxy/desktop tauri build --bundles deb
      # Portable AppImage: freedesktop-compliant desktop entry (no Kali category).
      - run: pnpm --filter @chosproxy/desktop tauri build --bundles appimage --config ../../packaging/appimage.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: chosproxy-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
